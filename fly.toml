# Fly.io config for the render worker (worker/server.ts). Not used by the Vercel app.
# Deploy from the repo root:  fly deploy      Setup steps: worker/README.md
app = "fooddie-render"
primary_region = "iad"            # Ashburn, next to Vercel's iad1

[build]
  dockerfile = "worker/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # Idle machines stop, so you pay only while a render runs. A request starts one in ~1-2 s.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "requests"
    soft_limit = 1                # one render per machine, so renders never share CPU
    hard_limit = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

# Dedicated CPUs: shared Fly CPUs are throttled under sustained load like ffmpeg.
# 4 GB: a render downloads up to 6 uploaded videos into /tmp.
[[vm]]
  size = "performance-2x"
  memory = "4gb"
